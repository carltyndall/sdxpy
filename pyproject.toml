[project]
name = "sdxpy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mccole>=2.13.1",
    "ruff>=0.15.15"
]

[tool.mccole]
brand = "sdxpy"
title = "Software Design by Example"
repo = "https://github.com/gvwilson/sdxpy"
skips = [
    "*.as",
    "*.csv",
    "*.dot",
    "*.ht",
    "*.html",
    "*.js",
    "*.json",
    "*.mx",
    "*.out",
    "*.pdf",
    "*.py",
    "*.pyc",
    "*.sh",
    "*.tbl",
    "*.tll",
    "*.txt",
    "*.webp",
    "*.xml",
    "*.yml",
    "*~",
    "Makefile",
    "__pycache__",
    "docs",
    "examples.mk",
    "typos.toml",
    "unused",
    "uv.lock"
]
